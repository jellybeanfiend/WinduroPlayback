name: Validate track data

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-tracks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test race data validator
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test local race editor
        run: node --test tests/manage_editor.test.js
      - name: Validate manifest and GPX files
        run: python scripts/validate_tracks.py
